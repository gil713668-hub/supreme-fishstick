  var q=document.getElementById("q").value.trim(),sf=document.getElementById("src").value;
  var pf=document.getElementById("prg").value;
  var list=C.filter(function(c){return(!q||(c.name+c.proj).indexOf(q)>-1)&&(sf===""||String(c.src)===sf)&&(pf===""||(pf==="f"?nextStep(c)<=1:String(nextStep(c))===pf))});
  // funnel: how many reached each stage or beyond (rejected excluded)
  var f=document.getElementById("funnel"),prev=null,h="";
  for(var i=0;i<5;i++){
    var n=C.filter(function(c){return c.st!==5&&c.st>=i}).length;
    var pct=prev&&prev>0?Math.round(n/prev*100)+"% מהשלב הקודם":"כל הפניות";
    h+='<div class="fs"><span>'+STAGES[i]+'</span><b>'+n+'</b><i>'+pct+'</i></div>';prev=n;
  }
  var rej=C.filter(function(c){return c.st===5}).length;
  h+='<div class="fs"><span>נדחו</span><b>'+rej+'</b><i>&nbsp;</i></div>';
  f.innerHTML=h;
  var b=document.getElementById("board");b.innerHTML="";
  STAGES.forEach(function(sn,si){
    var items=list.filter(function(c){return c.st===si}).sort(function(a,b){return(score(b)||0)-(score(a)||0)});
    var col=document.createElement("div");col.className="col";
    col.innerHTML='<h2>'+sn+'<em>'+items.length+'</em></h2>';
    items.forEach(function(c){
      var s=score(c),el=document.createElement("button");el.className="card";
      el.innerHTML='<div class="n">'+esc(c.name)+'</div><div class="p">'+esc(c.proj)+'</div>'+prog(c)+mk(c)+'<div class="r"><span>'+SRC[c.src]+'</span><span class="sc '+cls(s)+'">'+(s===null?"טרם נבדק":s)+'</span></div>';
      el.onclick=function(){openC(c.id)};col.appendChild(el);
    });
    if(!items.length)col.insertAdjacentHTML("beforeend",'<div class="sub" style="padding:6px 4px">אין מועמדים בשלב זה</div>');
    b.appendChild(col);
  });
}

function openC(id){
  cur=C.filter(function(c){return c.id===id})[0];var d=document.getElementById("dlg");
  var h='<div style="display:flex;justify-content:space-between;gap:10px"><div><b style="font-size:18px">'+esc(cur.name)+'</b><div class="sub">'+esc(cur.proj)+' · '+SRC[cur.src]+'</div></div><div class="big" id="tot"></div></div>';
  h+='<div class="sub" style="margin-top:10px">'+[cur.status,cur.fac,cur.intro?'בוגר/ת INTRO':''].filter(Boolean).map(esc).join(' · ')+'</div>';
  if(cur.desc)h+='<p style="margin:8px 0 0"><b>על המיזם:</b> '+esc(cur.desc)+'</p>';
  if(cur.stage)h+='<p style="margin:6px 0 0"><b>שלב המיזם:</b> '+esc(cur.stage)+'</p>';
  var m=MK[cur.id];h+=m?'<p style="margin:8px 0 0"><b>גודל שוק (גלובלי):</b> '+m.t+' · '+m.s+'<br><span class="sub">'+m.n+' · מקור: '+m.r+'</span></p>':'<p class="sub" style="margin:8px 0 0">גודל שוק: טרם נבדק</p>';
  h+='<p class="sub" style="margin:12px 0 2px">התקדמות בתהליך</p><div class="ckl">'+CK.map(function(k,i){return'<label><input type="checkbox" data-i="'+i+'"'+(cur.ck[i]?' checked':'')+'> '+k+'</label>'}).join("")+'</div>';
  h+='<p class="sub" style="margin:12px 0 2px">מחוון הערכה (1–5, משקל באחוזים)</p>';
  CRIT.forEach(function(k,i){h+='<div class="row"><label for="r'+i+'">'+k[0]+'</label><input type="range" id="r'+i+'" min="0" max="5" step="1" value="'+cur.s[i]+'"><span class="sub" id="v'+i+'">'+cur.s[i]+' ('+k[1]+'%)</span></div>'});
  h+='<div class="fld"><label for="nt" class="sub">הערות מהראיון</label><textarea id="nt" rows="3">'+esc(cur.note)+'</textarea></div>';
  h+='<div class="sub">העברה לשלב</div><div class="stg" id="stg"></div>';
  h+='<div class="foot"><button id="del">מחיקה</button><button class="pri" id="cl">סגירה</button></div>';
  d.innerHTML=h;
  function upd(){var s=score(cur),t=document.getElementById("tot");t.textContent=s===null?"–":s;t.className="big "+cls(s)}
  CRIT.forEach(function(k,i){document.getElementById("r"+i).oninput=function(e){cur.s[i]=+e.target.value;document.getElementById("v"+i).textContent=cur.s[i]+" ("+k[1]+"%)";upd();render()}});
  document.getElementById("nt").oninput=function(e){cur.note=e.target.value};
  d.querySelectorAll('.ckl input').forEach(function(x){x.onchange=function(){cur.ck[+x.dataset.i]=x.checked;render()}});
  var sg=document.getElementById("stg");
  STAGES.forEach(function(sn,si){var bt=document.createElement("button");bt.textContent=sn;if(cur.st===si)bt.className="on";bt.onclick=function(){cur.st=si;render();openC(cur.id)};sg.appendChild(bt)});
  document.getElementById("cl").onclick=function(){d.close()};
  document.getElementById("del").onclick=function(){C=C.filter(function(c){return c.id!==cur.id});d.close();render()};
  upd();if(!d.open)d.showModal();
}

function addC(){
  var d=document.getElementById("dlg");
  var h='<b style="font-size:18px">מועמד חדש</b><div class="fld"><input id="an" placeholder="שם מלא" aria-label="שם"><input id="ap" placeholder="שם הפרויקט" aria-label="פרויקט"><select id="as" aria-label="ערוץ">'+SRC.map(function(s,i){return'<option value="'+i+'">'+s+'</option>'}).join("")+'</select></div><div class="foot"><button id="ac">ביטול</button><button class="pri" id="ak">הוספה</button></div>';
  d.innerHTML=h;
  document.getElementById("ac").onclick=function(){d.close()};
  document.getElementById("ak").onclick=function(){
    var n=document.getElementById("an").value.trim();if(!n){document.getElementById("an").focus();return}
    C.push({id:nid++,name:n,proj:document.getElementById("ap").value.trim()||"ללא שם פרויקט",src:+document.getElementById("as").value,st:0,s:[0,0,0,0,0],note:"",ck:[true,false,false,false]});
    d.close();render();
  };
  d.showModal();
}

var ss=document.getElementById("src");
ss.innerHTML='<option value="">כל הערוצים</option>'+SRC.map(function(s,i){return'<option value="'+i+'">'+s+'</option>'}).join("");
ss.onchange=render;document.getElementById("prg").onchange=render;document.getElementById("q").oninput=render;document.getElementById("add").onclick=addC;
render();
</script>
</body>
